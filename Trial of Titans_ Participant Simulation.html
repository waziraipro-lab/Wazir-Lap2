<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trial of Titans</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#0D0D10;--panel:#12466B;--bz:#C9A24B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(90deg,#0D0D10 0%,#0B5A8F 100%) fixed,#0D0D10;color:#fff;font:16px/1.5 Lato,Arial,sans-serif}
#app{max-width:1000px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:Cinzel,serif;font-weight:700;font-size:20px;letter-spacing:3px}
.brand small{display:block;font:400 11px Lato,sans-serif;letter-spacing:2px;opacity:.75}
.hr{display:flex;gap:10px;align-items:center}
.chip{font-size:13px;padding:4px 12px;border:1px solid rgba(255,255,255,.4);border-radius:20px}
.tm{font-family:Cinzel,serif;font-weight:700;font-size:20px;border:2px solid #fff;border-radius:8px;padding:0 12px}
.pg{height:4px;background:rgba(255,255,255,.18);margin:12px 0;border-radius:2px}
.pg i{display:block;height:100%;background:var(--bz);border-radius:2px;transition:width .6s}
.scene{display:flex;align-items:flex-end;gap:12px;margin:14px 0}
.ch{width:120px;flex:none;text-align:center;opacity:.4;transition:all .5s;font-size:12px;letter-spacing:1px}
.ch svg{width:100%;height:auto;display:block}
.ch.on{opacity:1;filter:drop-shadow(0 0 14px rgba(255,255,255,.45));transform:translateY(-6px)}
.bub{flex:1;background:rgba(8,24,40,.75);border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:14px 18px;animation:up .5s both}
.bub i{display:block;font-style:normal;font-size:12px;letter-spacing:2px;color:var(--bz)}
.bub p{margin:2px 0 0;font-size:clamp(15px,2vw,19px)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:rgba(8,24,40,.65);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:20px;margin-top:12px}
h1,h2{font-family:Cinzel,serif;margin:0 0 8px}
h1{font-size:clamp(28px,5vw,44px);letter-spacing:2px}
h2{font-size:clamp(19px,3vw,25px)}
.k{font-size:12px;letter-spacing:2px;color:var(--bz)}
button{min-height:44px;padding:0 20px;border:1px solid rgba(255,255,255,.5);border-radius:8px;background:var(--panel);color:#fff;font:700 15px Lato,Arial,sans-serif;cursor:pointer}
button.p{background:#fff;color:var(--ink);border-color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--bz);outline-offset:2px}
.opt{display:block;width:100%;text-align:left;margin-top:8px;padding:12px 16px;font-weight:400}
.opt.s,.desk.s,.br.s{outline:2px solid #fff;background:#1a5c8a}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:12px}
.desk{text-align:left;padding:16px;min-height:96px;display:flex;flex-direction:column;gap:4px}
.desk b{font-family:Cinzel,serif;font-size:17px}
input,textarea{width:100%;margin-top:6px;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,.4);background:rgba(13,13,16,.6);color:#fff;font:16px Lato,Arial,sans-serif}
input[type=range]{padding:0;accent-color:#C9A24B}
textarea{min-height:110px;resize:vertical}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border:1px solid rgba(255,255,255,.3);padding:0 10px;text-align:left}
th{padding:8px 10px}
.br{display:flex;align-items:center;gap:10px;margin-top:8px;width:100%;text-align:left;font-weight:400;padding:8px 12px}
.br i{display:block;height:14px;background:var(--bz);border-radius:3px}
.out{background:var(--panel);border-radius:10px;padding:12px;margin-top:10px}
.note{font-size:12px;opacity:.7;margin-top:18px;text-align:center}
@media(max-width:700px){.scene{flex-wrap:wrap}.ch{width:84px}.bub{order:3;flex-basis:100%}}
@media (prefers-reduced-motion:reduce){.bub{animation:none}.ch,.pg i{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const QUEEN='<svg viewBox="0 0 120 160" aria-hidden="true"><path d="M30 160L42 84H78L90 160Z" fill="#12466B" stroke="#fff" stroke-width="2"/><path d="M30 158H90" stroke="#C9A24B" stroke-width="4"/><path d="M44 84Q60 72 76 84L78 100H42Z" fill="#1a5c8a" stroke="#fff" stroke-width="2"/><rect x="42" y="98" width="36" height="5" fill="#C9A24B"/><path d="M42 56Q36 84 46 96L52 70Z M78 56Q84 84 74 96L68 70Z" fill="#1b1b22"/><circle cx="60" cy="54" r="16" fill="#E8C9A0"/><path d="M43 56Q44 30 60 32Q76 30 77 56Q72 44 60 43Q48 44 43 56Z" fill="#1b1b22"/><path d="M45 36L49 20L55 30L60 15L65 30L71 20L75 36Z" fill="#C9A24B" stroke="#fff" stroke-width="1.5"/><circle cx="54" cy="54" r="1.8" fill="#0D0D10"/><circle cx="66" cy="54" r="1.8" fill="#0D0D10"/><path d="M55 61Q60 65 65 61" fill="none" stroke="#0D0D10" stroke-width="1.6" stroke-linecap="round"/></svg>';
const CMD='<svg viewBox="0 0 120 160" aria-hidden="true"><path d="M26 160L36 86H84L94 160Z" fill="#0A2540" stroke="#fff" stroke-width="2"/><rect x="42" y="84" width="36" height="46" rx="4" fill="#DDE6EE" stroke="#C9A24B" stroke-width="2"/><path d="M42 100H78M42 114H78" stroke="#C9A24B" stroke-width="2"/><path d="M42 130H78L82 152H38Z" fill="#C9A24B" stroke="#fff" stroke-width="1.5"/><circle cx="60" cy="58" r="15" fill="#E8C9A0"/><path d="M44 62Q42 32 60 31Q78 32 76 62L70 62Q70 46 60 46Q50 46 50 62Z" fill="#C9A24B" stroke="#fff" stroke-width="1.5"/><path d="M50 32Q60 2 70 32Z" fill="#fff"/><circle cx="54" cy="57" r="1.8" fill="#0D0D10"/><circle cx="66" cy="57" r="1.8" fill="#0D0D10"/><path d="M56 65H64" stroke="#0D0D10" stroke-width="1.6" stroke-linecap="round"/><path d="M102 30V158" stroke="#fff" stroke-width="3"/><path d="M102 18L97 36H107Z" fill="#C9A24B"/><circle cx="26" cy="120" r="19" fill="#12466B" stroke="#C9A24B" stroke-width="3"/><circle cx="26" cy="120" r="9" fill="none" stroke="#fff" stroke-width="2"/></svg>';
const ROOK='<svg viewBox="0 0 40 40" width="30" height="30" fill="none" stroke="#fff" stroke-width="2.5" aria-hidden="true"><path d="M8 6v6h24V6h-5v3h-3V6h-6v3h-3V6z M11 12l2 14h14l2-14 M9 26h22v5H9z M7 34h26"/></svg>';
const CL={pr:{n:'The Price Tablet',t:'What the customers pay',s:3},sc:{n:'The Treasury Scales',t:'What the kingdom can spare',s:4},dy:{n:'The Dockyard',t:'How the oil moves',s:5},sl:{n:'The Scroll of Numbers',t:'What the numbers say',s:6}};
const FO=[['a','Trim the discounts','12','Customers may buy less'],['b','Delay supplier payments','20','Suppliers may lose trust'],['c','Sell the old press','8','Cash once, then gone'],['d','Take a short-term loan','25','Interest to pay']];
const ST=[['Pressing',4],['Filtering',9],['Bottling',31],['Labelling',6],['Dispatch',12]];
const AN=[['North',128,'2%'],['South',112,'3%'],['East',99,'2%'],['West',88,'41%'],['Central',77,'3%']];
const DG=['Heavy discounting is eating the margin','Bottling delays are driving rush costs and returns','Data errors make the fall look worse than it is','Rising interest costs alone'];
const MV=[['fix','Fix the bottling line'],['clean','Clean up the returns data'],['disc','Cut the deep discounts'],['supp','Renegotiate supplier terms'],['loan','Take a short-term loan'],['flav','Launch a new flavour']];
const mvn=k=>MV.find(m=>m[0]==k)[1];
const st={sc:0,team:'',code:'',t0:0,end:0,log:[],done:{},sel:{},rev:0,plan:[],drop:'',sv:'',reason:'',disp:'',tid:null,out:''};
const $=s=>document.querySelector(s);
const fmt=n=>Math.floor(n/60)+':'+String(n%60).padStart(2,'0');
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wc=s=>s.trim()?s.trim().split(/\s+/).length:0;
const hs=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return(h>>>0).toString(36)};
const nd=()=>Object.keys(st.done).length;
function L(k,v){st.log.push([Math.round((Date.now()-st.t0)/1000),k,v])}
function go(n){st.sc=n;render();window.scrollTo(0,0)}
function scene(w,line,tag){return `<div class="scene"><div class="ch ${w=='q'?'on':''}">${QUEEN}The Queen</div><div class="bub">${tag?`<i>${tag}</i>`:''}<p>${line}</p></div><div class="ch ${w=='c'?'on':''}">${CMD}The Commander</div></div>`}
function head(){return `<div class="top"><div class="brand">${ROOK}<div>TRIAL OF TITANS<small>CONSULTANT OF THE YEAR 2027 · WAZIR</small></div></div><div class="hr">${st.team?`<span class="chip">${E(st.team)}</span>`:''}${st.sc>0&&st.sc<13?'<span class="tm" id="tm">20:00</span>':''}</div></div><div class="pg"><i style="width:${Math.min(100,st.sc/13*100)}%"></i></div>`}
const seal=(k,ok)=>`<div class="row"><button data-a="go" data-v="2">Back to the clues</button><button class="p" data-a="seal" data-v="${k}" ${ok?'':'disabled'}>Seal this clue</button></div>`;
const V={
0:()=>`<div class="card" style="text-align:center"><div class="k">WAZIR PRESENTS</div><h1>TRIAL OF TITANS</h1><p>Consultant of the Year 2027. One crew, one kingdom, 20 minutes of daylight. Every choice is recorded and no marks are shown.</p><div style="max-width:380px;margin:16px auto;text-align:left"><label for="tn">Crew name</label><input id="tn" maxlength="30" autocomplete="off"><label for="tc" style="display:block;margin-top:10px">Team code</label><input id="tc" maxlength="12" autocomplete="off"></div><button class="p" data-a="enter">Enter the Hall</button></div>`,
1:()=>scene('q','Commander, my olive groves have never sold more, yet the treasury grows thin. Sales are up 12% and profit is down 18%. Find out why, and tell me what to do.','ITHACA OLIVE CO.')+`<div class="card"><div class="k">THE VOYAGE</div><p style="margin:4px 0 0">Four clues, one cause, one plan, one storm. About 20 minutes.</p><div class="row"><span></span><button class="p" data-a="go" data-v="2">Begin</button></div></div>`,
2:()=>`<div class="card"><div class="k">ACT I · THE FOUR CLUES</div><h2>Where will you look?</h2><p style="margin:0">Open at least three. Each extra clue gives you more to go on, and costs you daylight.</p><div class="grid">${Object.keys(CL).map(k=>`<button class="desk" data-a="open" data-v="${k}" ${st.done[k]?'disabled':''}><span class="k">${st.done[k]?'SEALED':'CLUE'}</span><b>${CL[k].n}</b><span>${CL[k].t}</span></button>`).join('')}</div><div class="row"><span>${nd()} of 4 sealed</span><button class="p" data-a="go" data-v="7" ${nd()>=3?'':'disabled'}>Name the cause</button></div></div>`,
3:()=>`<div class="card"><div class="k">THE PRICE TABLET</div><h2>Do discounts pay?</h2><p>A bottle sells at ₹100 and costs ₹70 to make. Each 1% of discount lifts volume by 35 bottles, from a base of 1,000. Set the discount you would run.</p><input type="range" id="mkr" min="0" max="30" step="0.5" value="10" aria-label="Discount percent"><div class="out" id="mko"></div>${seal('pr',1)}</div>`,
4:()=>{const s=st.sel.sc||[],c=s.reduce((a,i)=>a+ +FO.find(f=>f[0]==i)[2],0);return `<div class="card"><div class="k">THE TREASURY SCALES</div><h2>Find ₹30 lakh to spare</h2><p>Pick the moves you would make. Each one has a catch.</p>${FO.map(f=>`<button class="opt ${s.includes(f[0])?'s':''}" data-a="tog" data-v="${f[0]}">${f[1]}: +₹${f[2]} lakh <small>(${f[3]})</small></button>`).join('')}<div class="out">Raised so far: <b>₹${c} lakh</b> of 30 lakh</div>${seal('sc',s.length)}</div>`},
5:()=>{const a=st.sel.dy;return `<div class="card"><div class="k">THE DOCKYARD</div><h2>Where is the oil getting stuck?</h2><p>Lots waiting at each station this week. Tap the jam.</p>${ST.map(s=>`<button class="br ${a==s[0]?'s':''}" data-a="stn" data-v="${s[0]}"><span style="width:90px">${s[0]}</span><i style="width:${s[1]*9}px"></i><span>${s[1]} lots</span></button>`).join('')}${seal('dy',a)}</div>`},
6:()=>{const r=st.sel.sl;return `<div class="card"><div class="k">THE SCROLL OF NUMBERS</div><h2>Which row worries you?</h2><p>Quarter 2 sales (₹ lakh) and share of orders returned. Tap the row you would question first.</p><table><tr><th>Region</th><th>Sales</th><th>Returns</th></tr>${AN.map(x=>`<tr><td colspan="3" style="padding:0"><button class="br ${r==x[0]?'s':''}" style="margin:0;border:0;border-radius:0;min-height:40px" data-a="row" data-v="${x[0]}"><span style="width:33%">${x[0]}</span><span style="width:33%">${x[1]}</span><span>${x[2]}</span></button></td></tr>`).join('')}</table>${seal('sl',r)}</div>`},
7:()=>scene('c',st.rev?'Look again, Commander. Choose once more.':'My Queen, the clues have spoken. I will name the cause.',st.rev?'REVISING':'THE VERDICT')+`<div class="card"><h2>What is really hurting profit?</h2>${DG.map((x,i)=>`<button class="opt" data-a="dg" data-v="${i}">${x}</button>`).join('')}</div>`,
8:()=>scene('c','A raven lands on the mast. The Harbour Master writes: the bottling line stopped nine times this month, and most West returns were leaking bottles.','CURVEBALL: THE RAVEN')+`<div class="card"><h2>Does this change your mind?</h2><div class="row"><button data-a="rv" data-v="keep">Keep my answer</button><button class="p" data-a="rv" data-v="revise">Revise it</button></div></div>`,
9:()=>scene('q','Good. Now chart the course. Choose the three moves you would make first.','ACT II · CHART THE COURSE')+`<div class="card">${MV.map(m=>`<button class="opt ${st.plan.includes(m[0])?'s':''}" data-a="pl" data-v="${m[0]}">${m[1]}</button>`).join('')}<div class="row"><span>${st.plan.length} of 3 chosen</span><button class="p" data-a="go" data-v="10" ${st.plan.length==3?'':'disabled'}>Present the plan</button></div></div>`,
10:()=>scene('q','The treasury is cut by 30%. You can only keep two of your three moves. Drop one.','CURVEBALL: THE QUEEN’S DECREE')+`<div class="card">${st.plan.map(k=>`<button class="opt" data-a="dr" data-v="${k}">Drop: ${mvn(k)}</button>`).join('')}</div>`,
11:()=>scene('c','Poseidon’s storm is upon us. Do we stay the course with the two moves left, or turn back and rework the plan?','ACT III · THE STORM')+`<div class="card"><button class="opt ${st.sv=='stay'?'s':''}" data-a="sv" data-v="stay">Stay the course</button><button class="opt ${st.sv=='turn'?'s':''}" data-a="sv" data-v="turn">Turn back and rework the plan</button><label for="rs" style="display:block;margin-top:12px">Why? One line.</label><input id="rs" maxlength="140" autocomplete="off" value="${E(st.reason)}"><div class="row"><span></span><button class="p" data-a="stormGo" ${st.sv?'':'disabled'}>Hold the helm</button></div></div>`,
12:()=>scene('q','Ithaca is in sight. Send me your dispatch: what to do, why, and the main risk. Fifty words.','THE LAST DISPATCH')+`<div class="card"><textarea id="dpt" aria-label="Dispatch to the Queen">${E(st.disp)}</textarea><div class="row"><span class="k" id="dpc">0 / 50 words</span><button class="p" data-a="send">Send to the Queen</button></div></div>`,
13:()=>scene('q',`Well sailed, ${E(st.team)}. Your voyage is sealed. The judges will name the Consultant of the Year at the ceremony.`,'ITHACA')+`<div class="card" style="text-align:center"><div class="k">VOYAGE COMPLETE</div><h2>Hand in your voyage seal</h2><p>Time on the water: ${fmt(Math.round((st.end-st.t0)/1000))}. Copy this code and give it to the organisers. Do not close this page until they confirm.</p><textarea id="sc" readonly style="min-height:90px">${st.out}</textarea><div class="row" style="justify-content:center"><span id="cp"></span><button class="p" data-a="copy">Copy voyage seal</button></div></div>`};
function tickT(){if(st.sc<1||st.sc>=13)return;const r=1200-Math.round((Date.now()-st.t0)/1000);const e=$('#tm');if(e)e.textContent=fmt(Math.max(0,r));if(r<=0)fin(1)}
function mkUp(){const d=+$('#mkr').value,u=1000+35*d,m=30-d;$('#mko').innerHTML=`Discount <b>${d}%</b> · Volume ${Math.round(u)} bottles · Margin ₹${m.toFixed(1)} per bottle · <b>Profit ₹${Math.round(u*m).toLocaleString('en-IN')}</b>`}
function ctr(){const t=$('#dpt'),o=$('#dpc');const f=()=>{const n=wc(t.value);o.textContent=n+' / 50 words';o.style.color=n>50?'#ff9b9b':''};t.addEventListener('input',f);f()}
function render(){$('#app').innerHTML=head()+V[st.sc]()+'<div class="note">Trial of Titans · Wazir, the Strategy and Consulting Club</div>';tickT();
 if(st.sc==3){mkUp();$('#mkr').addEventListener('input',mkUp)}
 if(st.sc==11)$('#rs').addEventListener('input',e=>{st.reason=e.target.value});
 if(st.sc==12)ctr()}
function fin(to){if(st.sc>=13)return;const d=$('#dpt');if(d)st.disp=d.value;if(to)L('timeout',1);L('disp',st.disp);L('end',1);st.end=Date.now();clearInterval(st.tid);
 const j=JSON.stringify({t:st.team,c:st.code,s:new Date(st.t0).toISOString(),e:new Date(st.end).toISOString(),x:Math.round((st.end-st.t0)/1000),l:st.log});
 st.out=btoa(unescape(encodeURIComponent(j)))+'.'+hs(j+'tot27');go(13)}
const A={
 enter(){const n=$('#tn').value.trim();if(!n){$('#tn').focus();return}st.team=n;st.code=$('#tc').value.trim();st.t0=Date.now();L('start',1);st.tid=setInterval(tickT,1000);go(1)},
 go(v){go(+v)},
 open(v){st.sel={};L('open',v);go(CL[v].s)},
 tog(v){const s=st.sel.sc=st.sel.sc||[],i=s.indexOf(v);i<0?s.push(v):s.splice(i,1);render()},
 stn(v){st.sel.dy=v;render()},row(v){st.sel.sl=v;render()},
 seal(v){if(v=='pr')L('pr',+$('#mkr').value);else L(v,st.sel[v]);st.done[v]=1;st.sel={};go(2)},
 dg(v){L('diag',+v);if(st.rev)go(9);else go(8)},
 rv(v){L('raven',v);if(v=='revise'){st.rev=1;go(7)}else go(9)},
 pl(v){const i=st.plan.indexOf(v);if(i>=0)st.plan.splice(i,1);else if(st.plan.length<3)st.plan.push(v);render()},
 dr(v){L('plan',st.plan.slice());L('drop',v);go(11)},
 sv(v){st.sv=v;st.reason=$('#rs').value;render()},
 stormGo(){st.reason=$('#rs').value;L('storm',[st.sv,st.reason]);go(12)},
 send(){const v=$('#dpt').value;if(!v.trim()||wc(v)>50){alert('Write your dispatch in 50 words or fewer.');return}st.disp=v;fin(0)},
 copy(){const e=$('#sc');e.select();let ok=0;try{ok=document.execCommand('copy')}catch(x){}const m=()=>{$('#cp').textContent=ok?'Copied.':'Select the code and copy it.'};if(navigator.clipboard)navigator.clipboard.writeText(e.value).then(()=>{ok=1;m()}).catch(m);else m()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)A[b.dataset.a](b.dataset.v)});
render();
</script>
</body>
</html>
